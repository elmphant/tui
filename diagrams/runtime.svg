<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="runtime-title runtime-desc" xmlns="http://www.w3.org/2000/svg">
<title id="runtime-title">Your app, the framework's effects</title>
<desc id="runtime-desc">Program sits between the outside world and your app. It turns keys from the terminal into messages for your app, takes back a new model and a command, runs the command as a process or request, hands its result to your app as the next message, and sends only changed cells to the terminal.</desc>
<defs>
    <marker id="rt-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<g stroke-width="0.8">
    <rect x="16" y="24" width="192" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)"/>
    <rect x="264" y="24" width="192" height="272" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)"/>
    <rect x="512" y="24" width="192" height="272" rx="8" fill="rgba(191,69,32,0.03)" stroke="rgba(191,69,32,0.45)" stroke-dasharray="4,4"/>
</g>
<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.14em" text-anchor="middle" fill="#4f5d75">
    <text x="112" y="52">OUTSIDE</text>
    <text x="360" y="52">FRAMEWORK</text>
    <text x="608" y="52" fill="#bf4520">YOUR CODE</text>
</g>

<g fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#rt-arrow)">
    <line x1="192" y1="96" x2="280" y2="96"/>
    <line x1="280" y1="128" x2="192" y2="128"/>
    <line x1="440" y1="152" x2="528" y2="152"/>
    <line x1="528" y1="200" x2="440" y2="200"/>
    <line x1="280" y1="224" x2="192" y2="224"/>
    <line x1="192" y1="256" x2="280" y2="256"/>
</g>

<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em" text-anchor="middle" fill="#4f5d75">
    <rect x="216" y="74" width="40" height="16" rx="2" fill="#f5f5f5"/><text x="236" y="86">KEYS</text>
    <rect x="212" y="134" width="48" height="16" rx="2" fill="#f5f5f5"/><text x="236" y="146">CELLS</text>
    <rect x="452" y="130" width="64" height="16" rx="2" fill="#f5f5f5"/><text x="484" y="142">MESSAGE</text>
    <rect x="444" y="206" width="80" height="16" rx="2" fill="#f5f5f5"/><text x="484" y="218">MODEL, CMD</text>
    <rect x="220" y="202" width="32" height="16" rx="2" fill="#f5f5f5"/><text x="236" y="214">CMD</text>
    <rect x="208" y="262" width="56" height="16" rx="2" fill="#f5f5f5"/><text x="236" y="274">RESULT</text>
</g>

<g text-anchor="middle">
    <rect x="32" y="72" width="160" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="32" y="72" width="160" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="112" y="108" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Terminal</text>
    <text x="112" y="128" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">keys and screen</text>

    <rect x="32" y="200" width="160" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="32" y="200" width="160" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="112" y="236" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Outside world</text>
    <text x="112" y="256" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">processes · HTTP</text>

    <rect x="280" y="72" width="160" height="208" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="360" y="172" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Program</text>
    <text x="360" y="192" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">runs every effect</text>

    <rect x="528" y="112" width="160" height="128" rx="6" fill="#f5f5f5"/>
    <rect x="528" y="112" width="160" height="128" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="608" y="172" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Your App</text>
    <text x="608" y="192" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">update() · view()</text>
</g>
</svg>
