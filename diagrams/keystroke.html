<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One key press, start to finish</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --rule:rgba(45,49,66,0.12); }
* { box-sizing:border-box; }
body { margin:0; padding:48px 24px; background:var(--paper); color:var(--ink); font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
main { max-width:720px; margin:0 auto; }
.eyebrow { margin:0 0 8px; font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }
h1 { margin:0 0 8px; font-size:28px; font-weight:600; }
.sub { margin:0 0 24px; font-size:16px; line-height:1.6; color:var(--muted); }
svg { display:block; width:100%; height:auto; margin:0 auto; }
/* Container query, not viewport: a column narrower than the window still gets the narrow drawing. */
.figure { container-type:inline-size; }
.narrow { display:none; max-width:344px; }
@container (max-width: 699px) { .default { display:none; } .narrow { display:block; } }
</style>
</head>
<body>
<main>
<p class="eyebrow">elmphant/tui</p>
<h1>One key press, start to finish</h1>
<p class="sub">The reader presses ↑ in a list. A frame is drawn only when the model changed, so a key nothing reacts to costs no redraw.</p>

<div class="figure">
<svg class="default" viewBox="0 0 720 616" role="img" aria-labelledby="keystroke-title keystroke-desc" xmlns="http://www.w3.org/2000/svg">
<title id="keystroke-title">One key press, start to finish</title>
<desc id="keystroke-desc">Program reads the bytes of the up arrow from the terminal, InputParser turns them into a KeyMsg, and your app's update returns a new model and a command. Only if the model changed, your app's view draws the widgets and Screen sends the changed cells to the terminal.</desc>
<defs>
    <marker id="ks-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>
    <marker id="ks-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#bf4520"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<rect x="196" y="328" width="464" height="200" rx="4" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>

<g stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,3">
    <line x1="88" y1="88" x2="88" y2="544"/>
    <line x1="224" y1="88" x2="224" y2="544"/>
    <line x1="360" y1="88" x2="360" y2="544"/>
    <line x1="496" y1="88" x2="496" y2="544"/>
    <line x1="632" y1="88" x2="632" y2="544"/>
</g>

<rect x="196" y="328" width="40" height="20" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="216" y="342" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
<rect x="244" y="330" width="152" height="16" rx="2" fill="#f5f5f5"/>
<text x="248" y="342" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em">[the model changed]</text>

<g fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8">
    <rect x="220" y="128" width="8" height="384"/>
    <rect x="356" y="168" width="8" height="56"/>
    <rect x="492" y="248" width="8" height="56"/>
    <rect x="492" y="376" width="8" height="56"/>
    <rect x="628" y="456" width="8" height="56"/>
</g>

<g fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ks-arrow)">
    <line x1="88" y1="136" x2="220" y2="136"/>
    <line x1="228" y1="176" x2="356" y2="176"/>
    <line x1="356" y1="216" x2="228" y2="216" stroke-dasharray="5,4"/>
    <line x1="228" y1="256" x2="492" y2="256"/>
    <line x1="492" y1="296" x2="228" y2="296" stroke-dasharray="5,4"/>
    <line x1="228" y1="384" x2="492" y2="384"/>
    <line x1="492" y1="424" x2="228" y2="424" stroke-dasharray="5,4"/>
    <line x1="228" y1="464" x2="628" y2="464"/>
</g>
<line x1="628" y1="504" x2="88" y2="504" stroke="#bf4520" stroke-width="1.6" marker-end="url(#ks-arrow-accent)"/>

<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em" text-anchor="middle" fill="#4f5d75">
    <rect x="124" y="114" width="64" height="16" rx="2" fill="#f5f5f5"/><text x="156" y="126">ESC [ A</text>
    <rect x="264" y="154" width="56" height="16" rx="2" fill="#f5f5f5"/><text x="292" y="166">PARSE</text>
    <rect x="248" y="194" width="88" height="16" rx="2" fill="#f5f5f5"/><text x="292" y="206">KEYMSG(UP)</text>
    <rect x="244" y="234" width="96" height="16" rx="2" fill="#f5f5f5"/><text x="292" y="246">UPDATE(MSG)</text>
    <rect x="384" y="274" width="88" height="16" rx="2" fill="#f5f5f5"/><text x="428" y="286">MODEL, CMD</text>
    <rect x="260" y="362" width="64" height="16" rx="2" fill="#f5f5f5"/><text x="292" y="374">VIEW()</text>
    <rect x="388" y="402" width="80" height="16" rx="2" fill="#f5f5f5"/><text x="428" y="414">WIDGETS</text>
    <rect x="256" y="442" width="72" height="16" rx="2" fill="#f5f5f5"/><text x="292" y="454">FLUSH</text>
    <rect x="508" y="482" width="112" height="16" rx="2" fill="#f5f5f5"/><text x="564" y="494" fill="#bf4520">CHANGED CELLS</text>
</g>

<g text-anchor="middle">
    <rect x="28" y="24" width="120" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="28" y="24" width="120" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="88" y="52" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Terminal</text>
    <text x="88" y="72" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">the reader</text>

    <rect x="164" y="24" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="224" y="52" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Program</text>
    <text x="224" y="72" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">event loop</text>

    <rect x="300" y="24" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="360" y="52" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">InputParser</text>
    <text x="360" y="72" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">bytes → keys</text>

    <rect x="436" y="24" width="120" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="436" y="24" width="120" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="496" y="52" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Your App</text>
    <text x="496" y="72" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">your code</text>

    <rect x="572" y="24" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="632" y="52" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Screen</text>
    <text x="632" y="72" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">diffs frames</text>
</g>

<line x1="24" y1="568" x2="696" y2="568" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#4f5d75" letter-spacing="0.04em">
    <line x1="108" y1="592" x2="148" y2="592" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ks-arrow)"/>
    <text x="160" y="596">CALL</text>
    <line x1="232" y1="592" x2="272" y2="592" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ks-arrow)"/>
    <text x="284" y="596">ANSWER</text>
    <line x1="372" y1="592" x2="412" y2="592" stroke="#bf4520" stroke-width="1.6" marker-end="url(#ks-arrow-accent)"/>
    <text x="424" y="596">ONLY CHANGED CELLS</text>
</g>
</svg>

<svg class="narrow" viewBox="0 0 344 552" role="img" aria-labelledby="keystroke-narrow-title keystroke-narrow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="keystroke-narrow-title">One key press, start to finish</title>
<desc id="keystroke-narrow-desc">Program reads the bytes of the up arrow from the terminal, InputParser turns them into a KeyMsg, and your app's update returns a new model and a command. Only if the model changed, your app's view draws the widgets and Screen sends the changed cells to the terminal.</desc>
<defs>
    <marker id="ksn-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<rect x="28" y="304" width="288" height="224" rx="4" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<rect x="28" y="304" width="124" height="20" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="90" y="318" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.08em">IF IT CHANGED</text>

<g fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ksn-arrow)">
    <line x1="172" y1="88" x2="172" y2="120"/>
    <line x1="172" y1="184" x2="172" y2="216"/>
    <line x1="172" y1="280" x2="172" y2="344"/>
    <line x1="172" y1="408" x2="172" y2="440"/>
</g>

<g text-anchor="middle">
    <rect x="44" y="24" width="256" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="44" y="24" width="256" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="172" y="52" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Terminal</text>
    <text x="172" y="72" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">sends ESC [ A</text>

    <rect x="44" y="120" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="172" y="148" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">InputParser</text>
    <text x="172" y="168" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">makes KeyMsg(Up)</text>

    <rect x="44" y="216" width="256" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="44" y="216" width="256" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="172" y="244" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">update()</text>
    <text x="172" y="264" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">returns a model and a Cmd</text>

    <rect x="44" y="344" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="172" y="372" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">view()</text>
    <text x="172" y="392" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">draws the widgets</text>

    <rect x="44" y="440" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="172" y="468" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Screen</text>
    <text x="172" y="488" fill="#bf4520" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">sends only changed cells</text>
</g>
</svg>
</div>
</main>
</body>
</html>
