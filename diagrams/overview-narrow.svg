<?xml version="1.0" encoding="UTF-8"?>
<svg width="344" height="888" viewBox="0 0 344 888" role="img" aria-labelledby="ovn-title ovn-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ovn-title">How it all works</title>
<desc id="ovn-desc">The framework turns keys from the terminal into messages for your update, which returns a new immutable model and a command. view draws that model's widgets, and Screen sends only the changes to the terminal. In the background the framework runs each command as a process or HTTP request and hands its result to update as the next message.</desc>
<defs>
    <marker id="ovn-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<g stroke-width="0.8">
    <rect x="8" y="16" width="328" height="108" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)"/>
    <rect x="8" y="164" width="328" height="116" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)"/>
    <rect x="8" y="336" width="328" height="224" rx="8" fill="rgba(191,69,32,0.03)" stroke="rgba(191,69,32,0.45)" stroke-dasharray="4,4"/>
    <rect x="8" y="584" width="328" height="96" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)"/>
    <rect x="8" y="712" width="328" height="96" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)"/>
</g>
<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.14em" text-anchor="middle" fill="#4f5d75">
    <text x="282" y="84">OUTSIDE</text>
    <text x="282" y="236">FRAMEWORK</text>
    <text x="112" y="544" fill="#bf4520">YOUR CODE</text>
    <text x="112" y="636">FRAMEWORK</text>
    <text x="112" y="764">OUTSIDE</text>
</g>

<g fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ovn-arrow)">
    <line x1="172" y1="112" x2="172" y2="200"/>
    <line x1="172" y1="264" x2="172" y2="352"/>
    <line x1="168" y1="416" x2="168" y2="456"/>
    <line x1="64" y1="456" x2="64" y2="416"/>
    <line x1="64" y1="352" x2="64" y2="264"/>
    <line x1="64" y1="200" x2="64" y2="112"/>
</g>
<g fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ovn-arrow)">
    <line x1="296" y1="416" x2="296" y2="600"/>
    <line x1="296" y1="664" x2="296" y2="728"/>
    <line x1="256" y1="728" x2="256" y2="664"/>
    <line x1="256" y1="600" x2="256" y2="416"/>
</g>

<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em" text-anchor="middle" fill="#4f5d75">
    <rect x="178" y="128" width="40" height="16" rx="2" fill="#f5f5f5"/><text x="198" y="140">KEYS</text>
    <rect x="70" y="128" width="46" height="16" rx="2" fill="#f5f5f5"/><text x="93" y="140">CELLS</text>
    <rect x="178" y="288" width="62" height="16" rx="2" fill="#f5f5f5"/><text x="209" y="300">MESSAGE</text>
    <rect x="70" y="288" width="62" height="16" rx="2" fill="#f5f5f5"/><text x="101" y="300">WIDGETS</text>
    <rect x="302" y="464" width="32" height="16" rx="2" fill="#f3f0ef"/><text x="318" y="476">CMD</text>
    <rect x="188" y="524" width="62" height="16" rx="2" fill="#f3f0ef"/><text x="219" y="536">MESSAGE</text>
    <rect x="302" y="684" width="32" height="16" rx="2" fill="#f5f5f5"/><text x="318" y="696">RUN</text>
    <rect x="196" y="684" width="54" height="16" rx="2" fill="#f5f5f5"/><text x="223" y="696">RESULT</text>
</g>

<g text-anchor="middle" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <rect x="16" y="48" width="204" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="16" y="48" width="204" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="118" y="76" fill="#2d3142" font-size="16" font-weight="600">Terminal</text>
    <text x="118" y="96" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">the reader</text>

    <rect x="16" y="200" width="96" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="64" y="228" fill="#2d3142" font-size="16" font-weight="600">Screen</text>
    <text x="64" y="248" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">only changes</text>

    <rect x="124" y="200" width="96" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="172" y="228" fill="#2d3142" font-size="16" font-weight="600">Input</text>
    <text x="172" y="248" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">parses keys</text>

    <rect x="16" y="352" width="96" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="64" y="380" fill="#2d3142" font-size="16" font-weight="600">view()</text>
    <text x="64" y="400" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">the widgets</text>

    <rect x="124" y="352" width="204" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="124" y="352" width="204" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="226" y="380" fill="#bf4520" font-size="16" font-weight="600">update()</text>
    <text x="226" y="400" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">new model + Cmd</text>

    <rect x="16" y="456" width="192" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="16" y="456" width="192" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="112" y="480" fill="#2d3142" font-size="16" font-weight="600">Model</text>
    <text x="112" y="498" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">immutable value</text>

    <rect x="224" y="600" width="104" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="276" y="628" fill="#2d3142" font-size="16" font-weight="600">Effects</text>
    <text x="276" y="648" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">runs each Cmd</text>

    <rect x="224" y="728" width="104" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="224" y="728" width="104" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="276" y="756" fill="#2d3142" font-size="16" font-weight="600">Processes</text>
    <text x="276" y="776" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">and HTTP</text>
</g>

<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#4f5d75">
    <line x1="16" y1="844" x2="48" y2="844" stroke="#4f5d75" stroke-width="1.4"/>
    <text x="56" y="848">every key, every frame</text>
    <line x1="16" y1="868" x2="48" y2="868" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="56" y="872">in the background</text>
</g>
</svg>
