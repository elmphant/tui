<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The update cycle</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --rule:rgba(45,49,66,0.12); }
* { box-sizing:border-box; }
body { margin:0; padding:48px 24px; background:var(--paper); color:var(--ink); font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
main { max-width:720px; margin:0 auto; }
.eyebrow { margin:0 0 8px; font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }
h1 { margin:0 0 8px; font-size:28px; font-weight:600; }
.sub { margin:0 0 24px; font-size:16px; line-height:1.6; color:var(--muted); }
svg { display:block; width:100%; height:auto; margin:0 auto; }
/* Container query, not viewport: a column narrower than the window still gets the narrow drawing. */
.figure { container-type:inline-size; }
.narrow { display:none; max-width:344px; }
@container (max-width: 699px) { .default { display:none; } .narrow { display:block; } }
</style>
</head>
<body>
<main>
<p class="eyebrow">elmphant/tui</p>
<h1>The update cycle</h1>
<p class="sub">Every message takes one trip around the ring. Only update() makes a new model; everything else reads it.</p>

<div class="figure">
<svg class="default" viewBox="0 0 720 584" role="img" aria-labelledby="update-cycle-title update-cycle-desc" xmlns="http://www.w3.org/2000/svg">

<desc id="update-cycle-desc">A message goes to update, which returns a new immutable model and maybe a command. view draws the widgets of that model, Screen sends only the changed cells to the terminal, and what the reader does next becomes the next message.</desc>
<defs>
    <marker id="uc-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>

</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<g fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#uc-arrow)">
    <path d="M 448.000 78.367 A 220 220 0 0 1 555.411 178.933"/>
    <path d="M 577.035 244.000 A 220 220 0 0 1 523.581 427.110"/>
    <path d="M 418.788 492.000 A 220 220 0 0 1 302.369 492.318"/>
    <path d="M 197.224 428.000 A 220 220 0 0 1 142.772 245.184"/>
    <path d="M 164.041 180.000 A 220 220 0 0 1 270.901 78.850"/>
</g>
<line class="spoke" x1="480" y1="240.593" x2="453.706" y2="249.553" stroke="#7a8399" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#uc-arrow-soft)"/>

<g text-anchor="middle">
    <rect x="272" y="28" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="360" y="56" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Message</text>
    <text x="360" y="76" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">key · click · result</text>

    <rect x="480" y="180" width="176" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="480" y="180" width="176" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>

    <text x="568" y="228" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">new model + Cmd</text>

    <rect x="400" y="428" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="488" y="456" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">view()</text>
    <text x="488" y="476" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">draws the widgets</text>

    <rect x="144" y="428" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="232" y="456" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Screen</text>
    <text x="232" y="476" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">changed cells only</text>

    <rect x="64" y="180" width="176" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="64" y="180" width="176" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="152" y="208" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Terminal</text>
    <text x="152" y="228" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">the reader acts</text>

    <rect x="272" y="232" width="176" height="96" rx="6" fill="#2d3142"/>
    <text x="360" y="276" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Model</text>
    <text x="360" y="296" fill="#d6d7dc" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">immutable value</text>
</g>

<line x1="24" y1="524" x2="696" y2="524" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#4f5d75" letter-spacing="0.04em">
    <line x1="80" y1="556" x2="120" y2="556" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#uc-arrow)"/>
    <text x="132" y="560">ONE MESSAGE, ONE TRIP</text>
    <line x1="324" y1="556" x2="364" y2="556" stroke="#7a8399" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#uc-arrow-soft)"/>
    <text x="376" y="560">WRITES THE MODEL</text>
    <rect x="540" y="548" width="20" height="16" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
    <text x="572" y="560">YOUR CODE</text>
</g>
</svg>

<rect x="256" y="308" width="48" height="16" rx="2" fill="#f5f5f5"/>
<text x="280" y="320" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.04em">NEXT</text>

<g text-anchor="middle">
    <rect x="32" y="24" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="128" y="52" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Message</text>
    <text x="128" y="72" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">key · click · result</text>

    <rect x="32" y="128" width="192" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="32" y="128" width="192" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="128" y="156" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">update()</text>
    <text x="128" y="176" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">new model + Cmd</text>

    <rect x="32" y="232" width="192" height="64" rx="6" fill="#2d3142"/>
    <text x="128" y="260" fill="#f5f5f5" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Model</text>
    <text x="128" y="280" fill="#d6d7dc" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">immutable value</text>

    <rect x="32" y="336" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="128" y="364" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">view()</text>
    <text x="128" y="384" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">draws the widgets</text>

    <rect x="32" y="440" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="128" y="468" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Screen</text>
    <text x="128" y="488" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">changed cells only</text>

    <rect x="32" y="544" width="192" height="64" rx="6" fill="#f5f5f5"/>

<line x1="16" y1="640" x2="328" y2="640" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#4f5d75" letter-spacing="0.04em">
    <line x1="32" y1="672" x2="72" y2="672" stroke="#7a8399" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ucn-arrow-soft)"/>
    <text x="84" y="676">WRITES THE MODEL</text>
    <rect x="40" y="696" width="20" height="16" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>

</g>
</svg>
</div>
</main>
</body>
</html>
