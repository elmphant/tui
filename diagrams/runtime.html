<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your app, the framework's effects</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --rule:rgba(45,49,66,0.12); }
* { box-sizing:border-box; }
body { margin:0; padding:48px 24px; background:var(--paper); color:var(--ink); font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
main { max-width:720px; margin:0 auto; }
.eyebrow { margin:0 0 8px; font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:var(--muted); }
h1 { margin:0 0 8px; font-size:28px; font-weight:600; }
.sub { margin:0 0 24px; font-size:16px; line-height:1.6; color:var(--muted); }
svg { display:block; width:100%; height:auto; margin:0 auto; }
/* Container query, not viewport: a column narrower than the window still gets the narrow drawing. */
.figure { container-type:inline-size; }
.narrow { display:none; max-width:344px; }
@container (max-width: 699px) { .default { display:none; } .narrow { display:block; } }
</style>
</head>
<body>
<main>
<p class="eyebrow">elmphant/tui</p>
<h1>Your app, the framework's effects</h1>
<p class="sub">Your app never touches the terminal, a process or the network. It hands back data, and Program does the work.</p>

<div class="figure">
<svg class="default" viewBox="0 0 720 320" role="img" aria-labelledby="runtime-title runtime-desc" xmlns="http://www.w3.org/2000/svg">
<title id="runtime-title">Your app, the framework's effects</title>
<desc id="runtime-desc">Program sits between the outside world and your app. It turns keys from the terminal into messages for your app, takes back a new model and a command, runs the command as a process or request, hands its result to your app as the next message, and sends only changed cells to the terminal.</desc>
<defs>
    <marker id="rt-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>

</g>

<g text-anchor="middle">

    <rect x="32" y="200" width="160" height="80" rx="6" fill="#f5f5f5"/>

    <text x="112" y="256" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">processes · HTTP</text>

    <rect x="280" y="72" width="160" height="208" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

    <text x="608" y="172" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Your App</text>
    <text x="608" y="192" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">update() · view()</text>
</g>
</svg>

    <rect x="184" y="24" width="144" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="184" y="24" width="144" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="256" y="56" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Outside world</text>
