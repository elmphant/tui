<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="ov-title ov-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ov-title">How it all works</title>
<desc id="ov-desc">The framework turns keys from the terminal into messages for your update, which returns a new immutable model and a command. view draws that model's widgets, and Screen sends only the changes to the terminal. In the background the framework runs each command as a process or HTTP request and hands its result to update as the next message.</desc>
<defs>
    <marker id="ov-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<g stroke-width="0.8">
    <rect x="16" y="24" width="184" height="440" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)"/>
    <rect x="264" y="24" width="184" height="440" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.14)"/>
    <rect x="520" y="24" width="184" height="440" rx="8" fill="rgba(191,69,32,0.03)" stroke="rgba(191,69,32,0.45)" stroke-dasharray="4,4"/>
</g>
<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.14em" text-anchor="middle" fill="#4f5d75">
    <text x="108" y="48">OUTSIDE</text>
    <text x="356" y="48">FRAMEWORK</text>
    <text x="612" y="48" fill="#bf4520">YOUR CODE</text>
</g>

<g fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ov-arrow)">
    <line x1="184" y1="104" x2="280" y2="104"/>
    <line x1="432" y1="104" x2="536" y2="104"/>
    <line x1="596" y1="136" x2="596" y2="168"/>
    <line x1="596" y1="224" x2="596" y2="256"/>
    <line x1="536" y1="288" x2="432" y2="288"/>
    <line x1="280" y1="288" x2="184" y2="288"/>
</g>
<g fill="none" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#ov-arrow)">
    <path d="M 656,120 H 664 Q 672,120 672,128 V 384 Q 672,392 664,392 H 432"/>
    <line x1="280" y1="392" x2="184" y2="392"/>
    <line x1="184" y1="424" x2="280" y2="424"/>
    <path d="M 432,424 H 680 Q 688,424 688,416 V 104 Q 688,96 680,96 H 656"/>
</g>

<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em" text-anchor="middle" fill="#4f5d75">
    <rect x="212" y="82" width="40" height="16" rx="2" fill="#f5f5f5"/><text x="232" y="94">KEYS</text>
    <rect x="453" y="82" width="62" height="16" rx="2" fill="#f5f5f5"/><text x="484" y="94">MESSAGE</text>
    <rect x="453" y="266" width="62" height="16" rx="2" fill="#f5f5f5"/><text x="484" y="278">WIDGETS</text>
    <rect x="209" y="266" width="46" height="16" rx="2" fill="#f5f5f5"/><text x="232" y="278">CELLS</text>
    <rect x="468" y="370" width="32" height="16" rx="2" fill="#f5f5f5"/><text x="484" y="382">CMD</text>
    <rect x="216" y="370" width="32" height="16" rx="2" fill="#f5f5f5"/><text x="232" y="382">RUN</text>
    <rect x="205" y="402" width="54" height="16" rx="2" fill="#f5f5f5"/><text x="232" y="414">RESULT</text>
    <rect x="453" y="402" width="62" height="16" rx="2" fill="#f5f5f5"/><text x="484" y="414">MESSAGE</text>
</g>

<g text-anchor="middle" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <rect x="32" y="72" width="152" height="248" rx="6" fill="#f5f5f5"/>
    <rect x="32" y="72" width="152" height="248" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="108" y="192" fill="#2d3142" font-size="16" font-weight="600">Terminal</text>
    <text x="108" y="212" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">the reader</text>

    <rect x="32" y="376" width="152" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="32" y="376" width="152" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="108" y="404" fill="#2d3142" font-size="16" font-weight="600">Processes</text>
    <text x="108" y="424" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">and HTTP</text>

    <rect x="280" y="72" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="356" y="100" fill="#2d3142" font-size="16" font-weight="600">Input</text>
    <text x="356" y="120" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">parses keys</text>

    <rect x="280" y="256" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="356" y="284" fill="#2d3142" font-size="16" font-weight="600">Screen</text>
    <text x="356" y="304" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">only changes</text>

    <rect x="280" y="376" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="356" y="404" fill="#2d3142" font-size="16" font-weight="600">Effects</text>
    <text x="356" y="424" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">runs each Cmd</text>

    <rect x="536" y="72" width="120" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="536" y="72" width="120" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="596" y="100" fill="#bf4520" font-size="16" font-weight="600">update()</text>
    <text x="596" y="120" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">new model + Cmd</text>

    <rect x="536" y="168" width="120" height="56" rx="6" fill="#f5f5f5"/>
    <rect x="536" y="168" width="120" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="596" y="192" fill="#2d3142" font-size="16" font-weight="600">Model</text>
    <text x="596" y="210" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">immutable value</text>

    <rect x="536" y="256" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="596" y="284" fill="#2d3142" font-size="16" font-weight="600">view()</text>
    <text x="596" y="304" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">the widgets</text>
</g>

<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" fill="#4f5d75">
    <line x1="16" y1="496" x2="48" y2="496" stroke="#4f5d75" stroke-width="1.4"/>
    <text x="56" y="500">every key, every frame</text>
    <line x1="264" y1="496" x2="296" y2="496" stroke="#4f5d75" stroke-width="1.4" stroke-dasharray="5,4"/>
    <text x="304" y="500">in the background, as commands</text>
</g>
</svg>
