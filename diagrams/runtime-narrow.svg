<?xml version="1.0" encoding="UTF-8"?>
<svg width="344" height="440" viewBox="0 0 344 440" role="img" aria-labelledby="runtime-narrow-title runtime-narrow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="runtime-narrow-title">Your app, the framework's effects</title>
<desc id="runtime-narrow-desc">Program sits between the outside world and your app. It turns keys from the terminal into messages for your app, takes back a new model and a command, runs the command as a process or request, hands its result to your app as the next message, and sends only changed cells to the terminal.</desc>
<defs>
    <marker id="rtn-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<g fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#rtn-arrow)">
    <line x1="64" y1="96" x2="64" y2="184"/>
    <line x1="112" y1="184" x2="112" y2="96"/>
    <line x1="232" y1="184" x2="232" y2="96"/>
    <line x1="280" y1="96" x2="280" y2="184"/>
    <line x1="144" y1="256" x2="144" y2="344"/>
    <line x1="200" y1="344" x2="200" y2="256"/>
</g>

<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em" text-anchor="middle" fill="#4f5d75">
    <rect x="20" y="132" width="36" height="16" rx="2" fill="#f5f5f5"/><text x="38" y="144">KEYS</text>
    <rect x="120" y="132" width="48" height="16" rx="2" fill="#f5f5f5"/><text x="144" y="144">CELLS</text>
    <rect x="192" y="132" width="32" height="16" rx="2" fill="#f5f5f5"/><text x="208" y="144">CMD</text>
    <rect x="288" y="132" width="52" height="16" rx="2" fill="#f5f5f5"/><text x="314" y="144">RESULT</text>
    <rect x="80" y="292" width="56" height="16" rx="2" fill="#f5f5f5"/><text x="108" y="304">MESSAGE</text>
    <rect x="208" y="292" width="80" height="16" rx="2" fill="#f5f5f5"/><text x="248" y="304">MODEL, CMD</text>
</g>

<g text-anchor="middle">
    <rect x="16" y="24" width="144" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="16" y="24" width="144" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="88" y="56" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Terminal</text>
    <text x="88" y="76" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">keys and screen</text>

    <rect x="184" y="24" width="144" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="184" y="24" width="144" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="256" y="56" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Outside world</text>
    <text x="256" y="76" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">processes · HTTP</text>

    <rect x="16" y="184" width="312" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="172" y="216" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Program</text>
    <text x="172" y="236" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">the framework runs every effect</text>

    <rect x="72" y="344" width="200" height="72" rx="6" fill="#f5f5f5"/>
    <rect x="72" y="344" width="200" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="172" y="376" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Your App</text>
    <text x="172" y="396" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">update() · view()</text>
</g>
</svg>
