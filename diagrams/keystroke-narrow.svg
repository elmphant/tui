<?xml version="1.0" encoding="UTF-8"?>
<svg width="344" height="552" viewBox="0 0 344 552" role="img" aria-labelledby="keystroke-narrow-title keystroke-narrow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="keystroke-narrow-title">One key press, start to finish</title>
<desc id="keystroke-narrow-desc">Program reads the bytes of the up arrow from the terminal, InputParser turns them into a KeyMsg, and your app's update returns a new model and a command. Only if something on screen changed, your app's view draws the widgets and Screen sends the changed cells to the terminal.</desc>
<defs>
    <marker id="ksn-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<rect x="28" y="304" width="288" height="224" rx="4" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<rect x="28" y="304" width="124" height="20" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="90" y="318" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.08em">IF IT CHANGED</text>

<g fill="none" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#ksn-arrow)">
    <line x1="172" y1="88" x2="172" y2="120"/>
    <line x1="172" y1="184" x2="172" y2="216"/>
    <line x1="172" y1="280" x2="172" y2="344"/>
    <line x1="172" y1="408" x2="172" y2="440"/>
</g>

<g text-anchor="middle">
    <rect x="44" y="24" width="256" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="44" y="24" width="256" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="172" y="52" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Terminal</text>
    <text x="172" y="72" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">sends ESC [ A</text>

    <rect x="44" y="120" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="172" y="148" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">InputParser</text>
    <text x="172" y="168" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">makes KeyMsg(Up)</text>

    <rect x="44" y="216" width="256" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="44" y="216" width="256" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="172" y="244" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">update()</text>
    <text x="172" y="264" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">returns a model and a Cmd</text>

    <rect x="44" y="344" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="172" y="372" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">view()</text>
    <text x="172" y="392" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">draws the widgets</text>

    <rect x="44" y="440" width="256" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="172" y="468" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Screen</text>
    <text x="172" y="488" fill="#bf4520" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">sends only changed cells</text>
</g>
</svg>
