<?xml version="1.0" encoding="UTF-8"?>
<svg width="344" height="952" viewBox="0 0 344 952" role="img" aria-labelledby="program-tick-narrow-title program-tick-narrow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="program-tick-narrow-title">One turn of the event loop</title>
<desc id="program-tick-narrow-desc">Woken by a key, a signal or a timer, Program reads the input, runs due timers and collects process output, then hands every queued message to update. If the program quit, start returns with the terminal restored. Otherwise it draws a frame only when one is due, and sleeps until the next event.</desc>
<defs>
    <marker id="ptn-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#4f5d75"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<g transform="translate(12,0)">
<g fill="none" stroke="#4f5d75" stroke-width="1.4">
    <g marker-end="url(#ptn-arrow)">
        <line x1="148" y1="80" x2="148" y2="112"/>
        <line x1="148" y1="176" x2="148" y2="208"/>
        <line x1="148" y1="272" x2="148" y2="304"/>
        <line x1="148" y1="368" x2="148" y2="400"/>
        <line x1="148" y1="480" x2="148" y2="520"/>
        <line x1="148" y1="600" x2="148" y2="640"/>
        <line x1="148" y1="748" x2="148" y2="776"/>
        <path d="M 248,440 H 296 Q 304,440 304,448 V 892 Q 304,900 296,900 H 264"/>
    </g>
    <line x1="148" y1="704" x2="148" y2="740"/>
    <path d="M 48,560 H 24 Q 16,560 16,568 V 736 Q 16,744 24,744 H 144"/>
</g>
<circle cx="148" cy="744" r="4" fill="#2d3142"/>

<g font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em" text-anchor="middle" fill="#4f5d75">
    <rect x="258" y="418" width="32" height="16" rx="2" fill="#f5f5f5"/><text x="274" y="430">NO</text>
    <rect x="156" y="492" width="36" height="16" rx="2" fill="#f5f5f5"/><text x="174" y="504">YES</text>
    <rect x="156" y="612" width="36" height="16" rx="2" fill="#f5f5f5"/><text x="174" y="624">YES</text>
    <rect x="24" y="612" width="32" height="16" rx="2" fill="#f5f5f5"/><text x="40" y="624">NO</text>
</g>

<g text-anchor="middle">
    <rect x="32" y="24" width="232" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="148" y="48" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Wake up</text>
    <text x="148" y="68" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">a key, a signal or a timer</text>

    <rect x="32" y="112" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="148" y="140" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Read input</text>
    <text x="148" y="160" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">keys, mouse, paste</text>

    <rect x="32" y="208" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="148" y="236" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Run timers and effects</text>
    <text x="148" y="256" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">ticks and process output</text>

    <rect x="32" y="304" width="232" height="64" rx="6" fill="#f5f5f5"/>
    <rect x="32" y="304" width="232" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
    <text x="148" y="332" fill="#bf4520" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Drain the queue</text>
    <text x="148" y="352" fill="#2d3142" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">update() per message</text>

    <polygon points="148,400 248,440 148,480 48,440" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="148" y="446" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Still running?</text>

    <polygon points="148,520 248,560 148,600 48,560" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="148" y="566" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Redraw now?</text>

    <rect x="32" y="640" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="148" y="668" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Draw a frame</text>
    <text x="148" y="688" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">only changed cells</text>

    <rect x="32" y="776" width="232" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="148" y="800" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Sleep</text>
    <text x="148" y="820" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">until the next event</text>

    <rect x="32" y="872" width="232" height="56" rx="28" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="148" y="896" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">start() returns</text>
    <text x="148" y="916" fill="#4f5d75" font-size="12" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace">terminal restored</text>
</g>
</g>
</svg>
